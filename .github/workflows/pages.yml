# Publishes the calendar to GitHub Pages. The daily research routine's commit is
# what normally triggers this — it pushes data, this rebuilds and republishes.
name: Deploy to Pages

on:
  push:
    branches: [main, routine]
  workflow_dispatch:

# Never publish a half-built site, but let a run in progress finish rather than
# cancelling it — two data commits close together should both end up live.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # The routine pushes to `routine`, never to main. Everything that lands there
  # is by definition the routine's, so the check needs no author heuristic: every
  # commit the branch adds on top of main must touch nothing outside data/.
  # An earlier version keyed on the commit's author email, which the routine sets
  # itself with `git -c user.email=` — a run that dropped the flag would have
  # walked straight past it.
  guard:
    if: github.ref == 'refs/heads/routine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The routine may only change data/
        run: |
          set -euo pipefail
          git fetch --quiet origin main

          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::routine is not based on current main — rebase and push again."
            exit 1
          fi

          failed=0
          for sha in $(git rev-list origin/main..HEAD); do
            outside="$(git show --pretty=format: --name-only "$sha" | grep -v '^$' | grep -v '^data/' || true)"
            if [ -n "$outside" ]; then
              echo "::error::commit $sha changed files outside data/:"
              echo "$outside"
              failed=1
            fi
          done
          exit $failed

  # Only a guarded branch reaches main. This is a fast-forward, so it satisfies
  # the ruleset that blocks force-pushes. Pushes made with GITHUB_TOKEN do not
  # start a new workflow run, which is why build and deploy follow here rather
  # than waiting for a push event that will never arrive.
  promote:
    needs: guard
    if: github.ref == 'refs/heads/routine'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward main
        run: git push origin HEAD:main

  build:
    needs: [guard, promote]
    # guard and promote are skipped for a direct push to main; only a real
    # failure should stop the build.
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A bad data commit should leave the last good build published rather
      # than replace it with a broken one.
      - name: Validate data
        run: npm run validate:data

      - name: Unit tests
        run: npm test

      - name: Build static site
        run: npm run build:static
        env:
          # A project site is served from /<repo>, so every asset URL needs the prefix.
          TECHCAL_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
